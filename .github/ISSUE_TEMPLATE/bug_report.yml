name: Bug report
description: Report incorrect guidance, an installation problem, or a tool failure.
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. For vulnerabilities, follow SECURITY.md instead of posting details here."
  - type: input
    id: version
    attributes:
      label: Skill version and variant
      placeholder: "2.1.0, OpenAI or OpenCode"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Assistant and version, OS, Node.js version if using scripts, and SuiteCRM release if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Sanitized prompt, commands, or steps and minimal sample files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Sanitized output and relevant official documentation links.

name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
          const skill = readFileSync('skill/suitecrm-expert-skill/SKILL.md', 'utf8');
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          assert.equal(manifest.version, pkg.version);
          assert(skill.includes(`version: "${pkg.version}"`));
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create reviewable draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/suitecrm-expert-skill-openai.zip \
            release-assets/suitecrm-expert-skill-opencode.zip \
            release-assets/manifest.json \
            --verify-tag --draft --title "SuiteCRM Expert Skill $RELEASE_TAG" \
            --generate-notes
